name: Security Scan (SAST, IaC, SCA & Secrets)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-scan:
    name: Secrets, SAST, IaC & SCA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Prepare Output Directory
        run: mkdir -p results "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run Gitleaks Secret Scan
        id: gitleaks
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          rm -f "$RUNNER_TEMP/gitleaks.tar.gz"
          gitleaks git . --config .gitleaks.toml --redact --report-format sarif --report-path results/gitleaks.sarif --exit-code 1
          gitleaks dir . --config .gitleaks.toml --redact --exit-code 1

      - name: Run Semgrep OSS SAST Scan
        id: semgrep
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip semgrep
          semgrep scan --config p/default --config p/rust \
            --exclude node_modules --exclude dist --exclude target --exclude .terraform --exclude .firebase --exclude results \
            --sarif --output results/semgrep.sarif
          semgrep scan --config p/default --config p/rust \
            --exclude node_modules --exclude dist --exclude target --exclude .terraform --exclude .firebase --exclude results \
            --error --severity ERROR

      - name: Run Trivy IaC & SCA Scan
        id: trivy
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz" -o "$RUNNER_TEMP/trivy.tar.gz"
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/bin" trivy
          rm -f "$RUNNER_TEMP/trivy.tar.gz"
          trivy fs . --scanners vuln,misconfig --ignore-unfixed --ignorefile .trivyignore \
            --skip-dirs node_modules,dist,target,.terraform,.firebase,results \
            --format sarif --output results/trivy.sarif --exit-code 0
          trivy fs . --scanners vuln,misconfig --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore \
            --skip-dirs node_modules,dist,target,.terraform,.firebase,results \
            --exit-code 1

      - name: Write Security Summary
        if: always()
        env:
          OUTCOME_GITLEAKS: ${{ steps.gitleaks.outcome }}
          OUTCOME_SEMGREP: ${{ steps.semgrep.outcome }}
          OUTCOME_TRIVY: ${{ steps.trivy.outcome }}
        run: |
          python3 - <<'EOF'
          import json, os, pathlib

          rows = [
              ("Gitleaks (Secrets)", "results/gitleaks.sarif", os.environ.get("OUTCOME_GITLEAKS", "unknown")),
              ("Semgrep OSS (SAST)", "results/semgrep.sarif", os.environ.get("OUTCOME_SEMGREP", "unknown")),
              ("Trivy (IaC & SCA)", "results/trivy.sarif", os.environ.get("OUTCOME_TRIVY", "unknown")),
          ]

          lines = [
              "## Security Scan Summary",
              "",
              "| Scanner | Status | Blocking Findings (`error`) | Warnings / Notes |",
              "| :--- | :--- | ---: | ---: |",
          ]

          for name, path, outcome in rows:
              errors = 0
              warnings = 0
              p = pathlib.Path(path)
              if p.exists():
                  try:
                      data = json.loads(p.read_text(encoding="utf-8"))
                      for run in data.get("runs", []):
                          for res in run.get("results", []):
                              lvl = res.get("level", "warning").lower()
                              if lvl == "error":
                                  errors += 1
                              else:
                                  warnings += 1
                  except Exception:
                      pass
              badge = "✅ PASS" if outcome == "success" else ("⏭️ SKIPPED" if outcome == "skipped" else "❌ FAIL")
              lines.append(f"| {name} | {badge} | {errors} | {warnings} |")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("\n".join(lines) + "\n")
          EOF

      - name: Upload SARIF Compliance Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-scan-reports
          path: results/*.sarif
          retention-days: 30
          if-no-files-found: warn

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: results
