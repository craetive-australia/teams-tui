name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.1.5)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: teams-tui-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: teams-tui-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: teams-tui-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: teams-tui-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Sign binary with ad-hoc signature (macOS)
        if: matrix.os == 'macos-latest'
        run: codesign --force --sign - target/${{ matrix.target }}/release/teams-tui

      - name: Rename and compress binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mv target/${{ matrix.target }}/release/teams-tui ${{ matrix.artifact_name }}
          tar -czvf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Rename and compress binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Move-Item -Path "target\${{ matrix.target }}\release\teams-tui.exe" -Destination "${{ matrix.artifact_name }}"
          Compress-Archive -Path "${{ matrix.artifact_name }}" -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts with Cosign (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cosign sign-blob --yes \
            --bundle "${{ matrix.artifact_name }}.sigstore.json" \
            "${{ matrix.artifact_name }}"
          cosign sign-blob --yes \
            --bundle "${{ matrix.artifact_name }}.tar.gz.sigstore.json" \
            "${{ matrix.artifact_name }}.tar.gz"

      - name: Sign release artifacts with Cosign (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cosign sign-blob --yes `
            --bundle "${{ matrix.artifact_name }}.sigstore.json" `
            "${{ matrix.artifact_name }}"
          cosign sign-blob --yes `
            --bundle "${{ matrix.artifact_name }}.zip.sigstore.json" `
            "${{ matrix.artifact_name }}.zip"

      - name: Attest Build Provenance (Unix)
        if: matrix.os != 'windows-latest'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.tar.gz

      - name: Attest Build Provenance (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.zip

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            *.tar.gz
            *.zip
            *.sigstore.json
          draft: false
          generate_release_notes: true

  publish-crates-io:
    name: Publish to crates.io
    needs: build-and-release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }} || echo "Already published or failed"

  publish-homebrew:
    name: Publish to Homebrew Tap
    needs: build-and-release
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      TAP_REPO: "craetive-australia/homebrew-teams-tui"
      GITHUB_TOKEN: ${{ secrets.PAT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Homebrew Formula
        run: |
          REF_NAME="${{ inputs.tag || github.ref_name }}"
          VERSION="${REF_NAME#v}"
          MAC_ARM_URL="https://github.com/craetive-australia/teams-tui/releases/download/${REF_NAME}/teams-tui-macos-arm64.tar.gz"
          MAC_INTEL_URL="https://github.com/craetive-australia/teams-tui/releases/download/${REF_NAME}/teams-tui-macos-amd64.tar.gz"
          LINUX_URL="https://github.com/craetive-australia/teams-tui/releases/download/${REF_NAME}/teams-tui-linux-amd64.tar.gz"
          
          # We wait briefly to ensure GitHub Releases has processed the uploads
          sleep 10
          
          MAC_ARM_SHA=$(curl -sL $MAC_ARM_URL | shasum -a 256 | awk '{print $1}')
          MAC_INTEL_SHA=$(curl -sL $MAC_INTEL_URL | shasum -a 256 | awk '{print $1}')
          LINUX_SHA=$(curl -sL $LINUX_URL | shasum -a 256 | awk '{print $1}')
          
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${TAP_REPO}.git tap
          cd tap
          mkdir -p Formula
          cat > Formula/teams-tui.rb << EOF
          class TeamsTui < Formula
            desc "Terminal User Interface for Microsoft Teams using Microsoft Graph API"
            homepage "https://github.com/craetive-australia/teams-tui"
            version "${VERSION}"
            
            if OS.mac? && Hardware::CPU.arm?
              url "${MAC_ARM_URL}"
              sha256 "${MAC_ARM_SHA}"
            elsif OS.mac? && Hardware::CPU.intel?
              url "${MAC_INTEL_URL}"
              sha256 "${MAC_INTEL_SHA}"
            elsif OS.linux?
              url "${LINUX_URL}"
              sha256 "${LINUX_SHA}"
            end

            def install
              bin.install "teams-tui"
            end
          end
          EOF
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/teams-tui.rb
          git commit -m "Update teams-tui to ${VERSION}" || true
          git push origin main

  publish-scoop:
    name: Update Scoop Manifest
    needs: build-and-release
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Scoop Manifest
        run: |
          REF_NAME="${{ inputs.tag || github.ref_name }}"
          VERSION="${REF_NAME#v}"
          WIN_URL="https://github.com/craetive-australia/teams-tui/releases/download/${REF_NAME}/teams-tui-windows-amd64.exe.zip"
          
          # Wait briefly to ensure GitHub release asset is available
          sleep 5
          WIN_SHA=$(curl -sL $WIN_URL | shasum -a 256 | awk '{print $1}')
          
          jq ".version = \"${VERSION}\" | .architecture[\"64bit\"].url = \"${WIN_URL}\" | .architecture[\"64bit\"].hash = \"${WIN_SHA}\"" teams-tui.json > tmp.json
          mv tmp.json teams-tui.json
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH_NAME="automation/scoop-manifest-${VERSION}"
          git checkout -b "${BRANCH_NAME}"
          git add teams-tui.json
          git commit -m "chore(scoop): update manifest to ${VERSION}" || true
          git push origin "${BRANCH_NAME}" --force || true
          gh pr create --title "chore(scoop): update Scoop manifest to ${VERSION}" \
                       --body "Automated update of teams-tui.json for release ${VERSION}" \
                       --base main \
                       --head "${BRANCH_NAME}" || echo "PR creation skipped or already exists"

  publish-winget:
    name: Submit to WinGet
    needs: build-and-release
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      GH_TOKEN: ${{ secrets.PAT }}
      FORK_REPO: "vaanguarrdd/winget-pkgs"
    steps:
      - name: Submit WinGet Manifest Update
        run: |
          REF_NAME="${{ inputs.tag || github.ref_name }}"
          VERSION="${REF_NAME#v}"
          WIN_URL="https://github.com/craetive-australia/teams-tui/releases/download/${REF_NAME}/teams-tui-windows-amd64.exe.zip"
          
          # Wait briefly to ensure GitHub Releases has processed the upload
          sleep 10
          
          echo "Calculating SHA256 for ${WIN_URL}..."
          WIN_SHA=$(curl -sL "$WIN_URL" | sha256sum | awk '{print toupper($1)}')
          if [ -z "$WIN_SHA" ] || [ ${#WIN_SHA} -ne 64 ]; then
            echo "Failed to calculate valid SHA256 for ${WIN_URL}"
            exit 1
          fi
          echo "Installer SHA256: ${WIN_SHA}"
          
          RELEASE_DATE=$(date -u +%Y-%m-%d)
          MANIFEST_DIR="manifests/c/Craetive/teams-tui/${VERSION}"
          BRANCH_NAME="Craetive.teams-tui-${VERSION}"
          
          # 1. Sync fork with upstream microsoft/winget-pkgs
          echo "Syncing fork ${FORK_REPO} with upstream..."
          gh repo sync "$FORK_REPO" --source microsoft/winget-pkgs || true
          
          # 2. Get master branch SHA from fork
          MASTER_SHA=$(gh api "repos/${FORK_REPO}/git/refs/heads/master" --jq .object.sha)
          
          # 3. Create or reset branch on fork
          echo "Creating branch ${BRANCH_NAME} at ${MASTER_SHA}..."
          gh api "repos/${FORK_REPO}/git/refs" \
            -X POST \
            -f ref="refs/heads/${BRANCH_NAME}" \
            -f sha="${MASTER_SHA}" || \
          gh api "repos/${FORK_REPO}/git/refs/heads/${BRANCH_NAME}" \
            -X PATCH \
            -f sha="${MASTER_SHA}" \
            -F force=true
          
          # 4. Generate manifest contents
          VERSION_YAML=$(cat <<EOF
# yaml-language-server: \$schema=https://aka.ms/winget-manifest.version.1.12.0.schema.json

PackageIdentifier: Craetive.teams-tui
PackageVersion: ${VERSION}
DefaultLocale: en-AU
ManifestType: version
ManifestVersion: 1.12.0
EOF
)

          INSTALLER_YAML=$(cat <<EOF
# yaml-language-server: \$schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

PackageIdentifier: Craetive.teams-tui
PackageVersion: ${VERSION}
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
- RelativeFilePath: teams-tui-windows-amd64.exe
  PortableCommandAlias: teams-tui
Installers:
- Architecture: x64
  InstallerUrl: ${WIN_URL}
  InstallerSha256: ${WIN_SHA}
ManifestType: installer
ManifestVersion: 1.12.0
ReleaseDate: ${RELEASE_DATE}
EOF
)

          LOCALE_YAML=$(cat <<EOF
# yaml-language-server: \$schema=https://aka.ms/winget-manifest.defaultLocale.1.12.0.schema.json

PackageIdentifier: Craetive.teams-tui
PackageVersion: ${VERSION}
PackageLocale: en-AU
Publisher: Craetive
PublisherUrl: https://github.com/craetive-australia
PublisherSupportUrl: https://github.com/craetive-australia/teams-tui/issues
PackageName: teams-tui
PackageUrl: https://github.com/craetive-australia/teams-tui
License: MIT
ShortDescription: A blazing fast, keyboard-centric Terminal User Interface for Microsoft Teams, written in Rust.
ReleaseNotesUrl: https://github.com/craetive-australia/teams-tui/releases/tag/${REF_NAME}
ManifestType: defaultLocale
ManifestVersion: 1.12.0
EOF
)

          # 5. Commit manifests to branch via GitHub API
          upload_manifest() {
            local filename="\$1"
            local content="\$2"
            local path="${MANIFEST_DIR}/\${filename}"
            local b64
            b64=\$(printf "%s" "\$content" | base64 -w 0)
            
            local existing_sha
            existing_sha=\$(gh api "repos/${FORK_REPO}/contents/\${path}?ref=${BRANCH_NAME}" --jq .sha 2>/dev/null || true)
            
            if [ -n "\$existing_sha" ]; then
              gh api "repos/${FORK_REPO}/contents/\${path}" \
                -X PUT \
                -f message="Update Craetive.teams-tui version ${VERSION}" \
                -f content="\${b64}" \
                -f branch="${BRANCH_NAME}" \
                -f sha="\${existing_sha}"
            else
              gh api "repos/${FORK_REPO}/contents/\${path}" \
                -X PUT \
                -f message="Add Craetive.teams-tui version ${VERSION}" \
                -f content="\${b64}" \
                -f branch="${BRANCH_NAME}"
            fi
          }

          echo "Uploading manifests to ${FORK_REPO}..."
          upload_manifest "Craetive.teams-tui.yaml" "\$VERSION_YAML"
          upload_manifest "Craetive.teams-tui.installer.yaml" "\$INSTALLER_YAML"
          upload_manifest "Craetive.teams-tui.locale.en-AU.yaml" "\$LOCALE_YAML"

          # 6. Create Pull Request using official Microsoft winget-pkgs title and PR body format
          PR_TITLE="New version: Craetive.teams-tui version ${VERSION}"
          PR_BODY=\$(cat <<EOF
## 📖 Description
Update \`Craetive.teams-tui\` to version \`${VERSION}\`.

Release Notes: https://github.com/craetive-australia/teams-tui/releases/tag/${REF_NAME}

## ✅ Checklist
- [x] Signed the [Contributor License Agreement](https://cla.opensource.microsoft.com)
- [ ] Linked to an issue (if applicable)

## 📦 Manifest Checklist
- [x] Checked that there aren't other open [pull requests](https://github.com/microsoft/winget-pkgs/pulls) for the same manifest update/change
- [x] This PR only modifies one (1) manifest
- [ ] Validated manifest locally with \`winget validate --manifest <path>\`
- [ ] Tested manifest locally with \`winget install --manifest <path>\`
- [x] Manifest conforms to the [1.12 schema](https://github.com/microsoft/winget-pkgs/tree/master/doc/manifest/schema/1.12.0)
EOF
)

          echo "Submitting pull request to microsoft/winget-pkgs..."
          gh pr create \
            --repo microsoft/winget-pkgs \
            --head "vaanguarrdd:${BRANCH_NAME}" \
            --base master \
            --title "\${PR_TITLE}" \
            --body "\${PR_BODY}" || echo "PR creation skipped or already exists"
