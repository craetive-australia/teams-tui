name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: teams-tui-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: teams-tui-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: teams-tui-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: teams-tui-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename and compress binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mv target/${{ matrix.target }}/release/teams-tui ${{ matrix.artifact_name }}
          tar -czvf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Rename and compress binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Move-Item -Path "target\${{ matrix.target }}\release\teams-tui.exe" -Destination "${{ matrix.artifact_name }}"
          Compress-Archive -Path "${{ matrix.artifact_name }}" -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.tar.gz
            *.zip
          draft: false
          generate_release_notes: true

  publish-package-managers:
    name: Publish to Package Managers
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }} || echo "Already published or failed"

      - name: Publish Homebrew Tap
        env:
          TAP_REPO: "craetive-australia/homebrew-teams-tui"
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          MAC_ARM_URL="https://github.com/craetive-australia/teams-tui/releases/download/${GITHUB_REF_NAME}/teams-tui-macos-arm64.tar.gz"
          MAC_INTEL_URL="https://github.com/craetive-australia/teams-tui/releases/download/${GITHUB_REF_NAME}/teams-tui-macos-amd64.tar.gz"
          LINUX_URL="https://github.com/craetive-australia/teams-tui/releases/download/${GITHUB_REF_NAME}/teams-tui-linux-amd64.tar.gz"
          
          # We wait briefly to ensure GitHub Releases has processed the uploads
          sleep 10
          
          MAC_ARM_SHA=$(curl -sL $MAC_ARM_URL | shasum -a 256 | awk '{print $1}')
          MAC_INTEL_SHA=$(curl -sL $MAC_INTEL_URL | shasum -a 256 | awk '{print $1}')
          LINUX_SHA=$(curl -sL $LINUX_URL | shasum -a 256 | awk '{print $1}')
          
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${TAP_REPO}.git tap
          cd tap
          mkdir -p Formula
          cat > Formula/teams-tui.rb << EOF
          class TeamsTui < Formula
            desc "Terminal User Interface for Microsoft Teams using Microsoft Graph API"
            homepage "https://github.com/craetive-australia/teams-tui"
            version "${VERSION}"
            
            if OS.mac? && Hardware::CPU.arm?
              url "${MAC_ARM_URL}"
              sha256 "${MAC_ARM_SHA}"
            elsif OS.mac? && Hardware::CPU.intel?
              url "${MAC_INTEL_URL}"
              sha256 "${MAC_INTEL_SHA}"
            elsif OS.linux?
              url "${LINUX_URL}"
              sha256 "${LINUX_SHA}"
            end

            def install
              bin.install "teams-tui"
            end
          end
          EOF
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/teams-tui.rb
          git commit -m "Update teams-tui to ${VERSION}" || true
          git push origin main

      - name: Update Scoop Manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          WIN_URL="https://github.com/craetive-australia/teams-tui/releases/download/${GITHUB_REF_NAME}/teams-tui-windows-amd64.exe.zip"
          
          WIN_SHA=$(curl -sL $WIN_URL | shasum -a 256 | awk '{print $1}')
          
          jq ".version = \"${VERSION}\" | .architecture[\"64bit\"].url = \"${WIN_URL}\" | .architecture[\"64bit\"].hash = \"${WIN_SHA}\"" teams-tui.json > tmp.json
          mv tmp.json teams-tui.json
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add teams-tui.json
          git commit -m "Update Scoop manifest to ${VERSION}" || true
          git push origin HEAD:main

      - name: Submit to Winget
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: craetive-australia.teams-tui
          version: ${{ github.ref_name }}
          installers-regex: '\.zip$'
          token: ${{ secrets.PAT }}
