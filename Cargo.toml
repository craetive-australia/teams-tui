[package]
name = "teams-tui"
version = "0.1.6"
edition = "2021"
authors = ["Teams TUI Team"]
description = "Terminal User Interface for Microsoft Teams using Microsoft Graph API"
license = "MIT"
repository = "https://github.com/andre/teams-tui"
keywords = ["tui", "teams", "microsoft", "graph", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
# TUI & Terminal Handling
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"

# Async runtime & Networking
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
directories = "5.0"

# CLI & Security
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.0", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.0", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.0", features = ["linux-native"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
